<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software | Andy J. Wang</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg-light: #ffffff;
            --color-text-light: #1a1a1a;
            --color-primary-light: #007bff;
            --color-secondary-light: #6c757d;
            --color-border-light: #e0e0e0;
            --color-card-bg: #f8fbff;
            --spacing-unit: 1rem;
            --max-width: 1000px;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            color: var(--color-text-light);
            background-color: var(--color-bg-light);
            line-height: 1.6;
        }

        header {
            padding: calc(var(--spacing-unit) * 1.5) calc(var(--spacing-unit) * 2);
            border-bottom: 1px solid var(--color-border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.6rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        nav a {
            margin-left: calc(var(--spacing-unit) * 1.8);
            text-decoration: none;
            color: var(--color-secondary-light);
            font-weight: 500;
            position: relative;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--color-primary-light);
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--color-primary-light);
            transition: width 0.3s ease-out;
        }

        nav a:hover::after {
            width: 100%;
        }

        main {
            max-width: var(--max-width);
            margin: calc(var(--spacing-unit) * 3) auto;
            padding: 0 var(--spacing-unit);
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: calc(var(--spacing-unit) * 2);
        }

        .software-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .software-card {
            background: linear-gradient(135deg, var(--color-card-bg), #ffffff);
            border: 1px solid var(--color-border-light);
            border-left: 5px solid var(--color-primary-light);
            border-radius: 12px;
            padding: calc(var(--spacing-unit) * 1.5);
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .software-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 123, 255, 0.12);
        }

        .software-title {
            margin: 0 0 0.6rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-text-light);
        }

        .software-description {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 350;
            color: #2d3748;
        }

        .repo-link {
            display: inline-block;
            margin-top: calc(var(--spacing-unit) * 1.2);
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            text-decoration: none;
            background-color: var(--color-primary-light);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 550;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .repo-link:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: var(--spacing-unit);
            }

            header h1 {
                margin-bottom: 0.5rem;
            }

            nav {
                width: 100%;
                text-align: center;
            }

            nav a {
                margin: 0 0.5rem;
            }

            h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Andy J. Wang</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="research.html">Research</a>
            <a href="software.html">Software</a>
        </nav>
    </header>

    <main>
        <h2>Software</h2>
        <ul class="software-list">
            <li class="software-card">
                <h3 class="software-title">rlearner</h3>
                <p class="software-description">A Python package that runs the R learner for heterogeneous treatment effect estimation and validation with flexible choices.</p>
                <a class="repo-link" href="https://github.com/andyjiayuwang/Python-based-R-Learner" target="_blank" rel="noopener noreferrer">View on GitHub</a>
            </li>
        </ul>
    </main>
</body>
</html>
